[project]
name = "keepassxc-falkon"
version = "0.1.0"
description = "KeePassXC password backend for the Falkon browser"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
# Runtime deps come from the system: Falkon's embedded Python with PySide6
# (QtWebEngine, QtNetwork) and libsodium. Nothing to install into Falkon.
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15", "mypy>=2", "ty>=0.0.90"]
# tests/e2e/run.py: build a throwaway KeePassXC database, drive Falkon over CDP
e2e = ["pykeepass>=4", "websocket-client>=1.6", "cryptography>=42"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PIE", "PT", "RET", "TRY", "BLE"]
ignore = ["TRY003"]  # descriptive exception messages are the point

[tool.mypy]
python_version = "3.11"
mypy_path = "stubs"
files = ["keepassxc_falkon", "tests"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true

[tool.ty.environment]
python = ".venv"
extra-paths = ["stubs"]

[[tool.mypy.overrides]]
module = "keepassxc_falkon.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["pykeepass.*"]      # e2e helper only; ships no type information
ignore_missing_imports = true

[tool.ty.src]
include = ["keepassxc_falkon", "tests"]
